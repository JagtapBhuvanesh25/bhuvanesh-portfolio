</head>
<body>

<div class="bg-grid" aria-hidden="true"></div>

<main class="stage">
  <p class="sr-only" id="skipHint">Press any key to skip the intro animation.</p>
  <section class="terminal" id="terminal" data-theme="green" role="application" aria-label="Interactive terminal portfolio for Bhuvanesh Jagtap">

    <header class="titlebar">
      <div class="dots" aria-hidden="true">
        <span class="dot dot-red"></span>
        <span class="dot dot-yellow"></span>
        <span class="dot dot-green"></span>
      </div>
      <div class="titlebar-name">bhuvanesh@portfolio — bash</div>
      <div class="titlebar-status" id="clock" aria-hidden="true"></div>
    </header>

    <nav class="quick-actions" aria-label="Quick commands">
      <button type="button" data-command="recruiter">recruiter</button>
      <button type="button" data-command="about">about</button>
      <button type="button" data-command="projects">projects</button>
      <button type="button" data-command="resume">resume</button>
      <button type="button" data-command="contact">contact</button>
    </nav>

    <div class="body" id="terminalBody" tabindex="-1">
      <div class="scanline" aria-hidden="true"></div>

      <div class="output" id="output" aria-live="polite"></div>

      <div class="inputline" id="inputline">
        <span class="prompt" id="promptText">bhuvanesh@portfolio:~$</span>
        <span class="typed" id="typedMirror"></span><span class="cursor" id="cursor">▌</span>
        <label class="sr-only" for="cmdInput">Terminal command input</label>
        <input
          type="text"
          id="cmdInput"
          class="hidden-input"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          aria-label="Type a command and press Enter"
        />
      </div>
    </div>
  </section>
</main>

<script src="main.js"></script>
</body>
</html>
